<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Security and Trustworthy Autonomous Cybersecurity | ANT & EDI 2027</title>
  <meta name="description" content="Workshop on AI Security and Trustworthy Autonomous Cybersecurity at ANT & EDI 2027, Delft, Netherlands, 13–15 April 2027.">
  <meta name="theme-color" content="#070b16">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AI Security and Trustworthy Autonomous Cybersecurity | ANT &amp; EDI 2027">
  <meta property="og:description" content="Workshop on AI security, trustworthy AI, and autonomous cybersecurity at ANT &amp; EDI 2027 in Delft, Netherlands, 13–15 April 2027.">
  <meta property="og:url" content="https://rayentech.github.io/WorkshopProposal-ant-edi-2027.github.io-/">
  <link rel="canonical" href="https://rayentech.github.io/WorkshopProposal-ant-edi-2027.github.io-/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070b16;
      --card: rgba(255,255,255,.05);
      --border: rgba(255,255,255,.12);
      --text: #e8edf7;
      --muted: #a7b0c3;
      --accent: #4f8cff;
      --accent-2: #00d4b8;
      --accent-3: #a06bff;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.65;
      overflow-x: hidden;
    }

    .dynamic-title {
      font-family: "Sora", sans-serif;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .dynamic-line {
      display: block;
      margin-top: 8px;
      color: #7ba7ff;
    }

    #dynamic-word {
      display: inline-block;
      background: linear-gradient(90deg, #7ba7ff, #00d4b8, #a06bff);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-flow 4s linear infinite;
      transition: opacity 0.28s ease, transform 0.28s ease;
      will-change: opacity, transform;
    }

    #dynamic-word.is-changing {
      opacity: 0;
      transform: translateY(8px);
    }

    .typing-cursor {
      color: #00d4b8;
      animation: cursor-blink 0.8s steps(2, start) infinite;
    }

    @keyframes gradient-flow {
      to { background-position: 200% center; }
    }

    @keyframes cursor-blink {
      to { visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }

      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .bg::before,
      .hero::before,
      .circuit-line,
      .circuit-ring,
      .visual-orbit,
      .floating-chip {
        animation: none !important;
        transform: none !important;
      }

      .motion-toggle { display: none; }
    }

    /* Premium cybersecurity atmosphere: layered aurora, luminous mesh and fine technical grid. */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 8% 6%, rgba(36,105,255,.19), transparent 32%),
        radial-gradient(ellipse at 94% 22%, rgba(0,221,198,.13), transparent 29%),
        radial-gradient(ellipse at 72% 86%, rgba(130,76,255,.16), transparent 35%),
        radial-gradient(ellipse at 48% 48%, rgba(24,49,95,.22), transparent 52%),
        linear-gradient(135deg, #050914 0%, #081225 48%, #070b18 100%);
      pointer-events: none;
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: -28%;
      background:
        radial-gradient(ellipse at 24% 30%, rgba(49,117,255,.31), transparent 25%),
        radial-gradient(ellipse at 72% 28%, rgba(0,221,198,.22), transparent 23%),
        radial-gradient(ellipse at 58% 74%, rgba(142,88,255,.23), transparent 29%),
        radial-gradient(ellipse at 84% 78%, rgba(30,103,218,.15), transparent 24%);
      filter: blur(58px);
      opacity: .9;
      transform: translate3d(-1.5%, -1%, 0) scale(1);
      animation: ambient-drift 30s ease-in-out infinite alternate;
      will-change: transform;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .2;
      background-image: radial-gradient(circle, rgba(173,207,255,.7) .75px, transparent 1.25px);
      background-size: 34px 34px;
      mask-image: radial-gradient(ellipse at 54% 38%, #000 0%, transparent 78%);
    }

    .grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(135,174,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(135,174,255,.045) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse at 50% 24%, #000 0%, transparent 84%);
    }

    .cyber-backdrop {
      position: fixed;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: .48;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.75) 58%, transparent 100%);
    }

    .cyber-backdrop svg { width: 100%; height: 100%; display: block; }

    .circuit-line {
      fill: none;
      stroke: url(#circuit-gradient);
      stroke-width: 1.15;
      stroke-dasharray: 5 12;
      animation: circuit-flow 24s linear infinite;
    }

    .circuit-node {
      fill: #8ddfff;
      filter: drop-shadow(0 0 5px rgba(72,190,255,.8));
    }

    .circuit-ring {
      fill: none;
      stroke: rgba(91,156,255,.19);
      stroke-width: 1;
      transform-origin: 1080px 420px;
      animation: ring-rotate 90s linear infinite;
    }

    @keyframes circuit-flow {
      to { stroke-dashoffset: -340; }
    }

    @keyframes ring-rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes ambient-drift {
      0% { transform: translate3d(-1.5%, -1%, 0) scale(1); }
      50% { transform: translate3d(1.2%, 1.1%, 0) scale(1.035); }
      100% { transform: translate3d(-.4%, 1.8%, 0) scale(1.015); }
    }

    /* Decorative fixed layers sit at z-index: 0; real content sits above them. */
    main,
    footer {
      position: relative;
      z-index: 1;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(7,11,22,.78);
      border-bottom: 1px solid var(--border);
      transition: background .25s ease, box-shadow .25s ease;
    }

    header.is-scrolled {
      background: rgba(7,11,22,.94);
      box-shadow: 0 12px 36px rgba(0,0,0,.22);
    }

    .scroll-progress {
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 2px;
      pointer-events: none;
      transform-origin: left center;
      transform: scaleX(0);
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
      box-shadow: 0 0 12px rgba(0,212,184,.45);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      font-family: "Sora", sans-serif;
      font-weight: 700;
      letter-spacing: -.02em;
      text-decoration: none;
      color: var(--text);
      flex-shrink: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(79,140,255,.22), rgba(0,212,184,.18));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 0 24px rgba(79,140,255,.12);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .brand:hover .brand-mark {
      transform: translateY(-2px) rotate(-3deg);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 0 28px rgba(0,212,184,.22);
    }

    .brand-mark svg { width: 29px; height: 29px; display: block; }

    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      gap: 4px;
      min-width: 0;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: .94rem;
      font-weight: 750;
      letter-spacing: -.025em;
      white-space: nowrap;
    }

    .brand-title span:last-child { color: #7ba7ff; }

    .brand-subtitle {
      color: var(--muted);
      font: 500 .62rem/1.2 "Inter", sans-serif;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-links a {
      position: relative;
      color: var(--muted);
      text-decoration: none;
      font-size: .88rem;
      font-weight: 550;
      padding: 10px 12px;
      border-radius: 999px;
      transition: color .2s ease, background .2s ease;
      white-space: nowrap;
    }

    .nav-links a:hover,
    .nav-links a[aria-current="location"] {
      color: white;
      background: rgba(255,255,255,.07);
    }

    .nav-links a[aria-current="location"]:not(.cta)::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 3px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .menu-toggle {
      display: none;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      color: var(--text);
      cursor: pointer;
    }

    .menu-toggle span {
      display: block;
      width: 18px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transition: transform .2s ease, opacity .2s ease;
    }

    .menu-toggle[aria-expanded="true"] span:first-child {
      transform: translateY(3.5px) rotate(45deg);
    }

    .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }

    .menu-toggle[aria-expanded="true"] span:last-child {
      transform: translateY(-3.5px) rotate(-45deg);
    }

    .cta {
      color: #04101f !important;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important;
      font-weight: 700 !important;
    }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 96px 0 72px;
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -19rem;
      right: -13rem;
      width: min(78vw, 900px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(0,212,184,.11), transparent 52%),
        radial-gradient(circle, rgba(79,140,255,.12) 1px, transparent 1.5px),
        linear-gradient(rgba(123,167,255,.065) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,167,255,.065) 1px, transparent 1px);
      background-size: auto, 34px 34px, 68px 68px, 68px 68px;
      opacity: .68;
      mask-image: radial-gradient(circle at center, #000 0%, rgba(0,0,0,.8) 42%, transparent 72%);
      transform: translate3d(0, 0, 0);
      animation: hero-mesh-drift 28s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .hero .container {
      position: relative;
      z-index: 1;
    }

    @keyframes hero-mesh-drift {
      from { transform: translate3d(0, 0, 0) rotate(0deg); }
      to { transform: translate3d(-1.5%, 2%, 0) rotate(3deg); }
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      color: var(--muted);
      font-size: .86rem;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 5px rgba(0,212,184,.14);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(0,212,184,.12); }
      50% { box-shadow: 0 0 0 9px rgba(0,212,184,.03); }
    }

    h1 {
      font-family: "Sora", sans-serif;
      font-size: clamp(2.4rem, 6vw, 4.3rem);
      line-height: 1.05;
      letter-spacing: -.045em;
      margin: 24px 0 18px;
      max-width: 900px;
    }

    .gradient {
      background: linear-gradient(100deg, #ffffff 10%, var(--accent) 42%, var(--accent-2) 70%, var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p.lead {
      color: var(--muted);
      font-size: clamp(1.02rem, 2vw, 1.22rem);
      max-width: 730px;
      margin: 0 0 32px;
    }

    .hero-actions {
      display: flex;
            flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 44px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 650;
      font-size: .97rem;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .btn-primary {
      color: #04101f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 14px 34px rgba(79,140,255,.25);
    }

    .btn-secondary {
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
    }

    .btn:hover { transform: translateY(-2px); }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 640px;
      margin-bottom: 36px;
    }

    .count-box {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 16px;
      padding: 18px 10px;
      text-align: center;
    }

    .count-value {
      font-family: "Sora", sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      font-weight: 800;
      line-height: 1;
    }

    .count-label {
      color: var(--muted);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-top: 8px;
    }

    .hero-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 830px;
    }

    .conference-note {
      max-width: 830px;
      margin-top: 20px;
      padding: 18px 20px;
      border: 1px solid rgba(0,212,184,.24);
      border-left: 3px solid var(--accent-2, var(--cyan));
      border-radius: 14px;
      background: linear-gradient(110deg, rgba(0,212,184,.07), rgba(79,140,255,.045));
    }

    .conference-note-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .conference-note a {
      color: var(--text);
      font-weight: 700;
      text-decoration-color: rgba(0,212,184,.7);
      text-underline-offset: 4px;
    }

    .conference-note a:hover { color: var(--accent-2, var(--cyan)); }

    .conference-note-date {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: .9rem;
    }

    .meta-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
    }

    .meta-label {
      color: var(--muted);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .meta-value {
      font-weight: 650;
      margin-top: 6px;
    }

    section {
      padding: 74px 0;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .section-head {
      max-width: 780px;
      margin-bottom: 38px;
    }

    .eyebrow {
      color: var(--accent-2);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h2 {
      font-family: "Sora", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -.035em;
      margin: 12px 0 14px;
    }

    .section-head p {
      color: var(--muted);
      margin: 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(79,140,255,.5);
      background: rgba(79,140,255,.08);
    }

    .card h3 {
      margin: 14px 0 8px;
      font-size: 1.08rem;
    }

    .card p {
      color: var(--muted);
      margin: 0;
      font-size: .95rem;
    }

    .icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(79,140,255,.13);
      border: 1px solid rgba(79,140,255,.25);
      font-size: 1.2rem;
    }

    .topics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .topic {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      border-radius: 14px;
      padding: 15px 17px;
      font-size: .95rem;
      transition: .2s ease;
    }

    .topic:hover {
      border-color: rgba(0,212,184,.5);
      background: rgba(0,212,184,.08);
      transform: translateY(-2px);
    }

    .submission {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 22px;
    }

    .panel {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
    }

    .panel h3 { margin-top: 0; }

    .panel ul {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
    }

    .panel li { margin: 8px 0; }

    .deadline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 0;
      border-bottom: 1px dashed var(--border);
    }

    .deadline:last-child { border-bottom: 0; }

    .deadline .deadline-label {
      color: var(--text);
      font-weight: 600;
    }

    .deadline .tba {
      text-align: right;
      white-space: normal;
    }

    .deadline .tba.is-extended {
      color: #9ff3e7;
      background: rgba(0,212,184,.10);
      border-color: rgba(0,212,184,.32);
    }

    .contact-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      color: var(--accent, #66d9ef);
      font-weight: 650;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .contact-action:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .tba {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(160,107,255,.13);
      border: 1px solid rgba(160,107,255,.3);
      color: #d7c6ff;
      font-size: .82rem;
      font-weight: 650;
    }

    .publication-panel {
      max-width: 920px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.8;
    }

    .publication-panel h3 {
      color: var(--text);
      margin-top: 24px;
    }

    .publication-panel a {
      color: var(--accent, #66d9ef);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .publication-note {
      padding: 14px 16px;
      border-left: 3px solid rgba(0,212,184,.65);
      background: rgba(0,212,184,.06);
      border-radius: 0 10px 10px 0;
      font-size: .92rem;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      max-width: 920px;
      margin: 0 auto;
    }

    .contact-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
      padding: 26px;
    }

    .contact-card h3 { margin: 10px 0 8px; }
    .contact-card p { color: var(--muted); }

    .contact-label {
      color: #72e5d2;
      font-size: .78rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .contact-email-pending {
      margin-bottom: 0;
      font-size: .9rem;
      font-style: italic;
    }

  <script>
    (() => {
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const header = document.getElementById("site-header");
      const progress = document.getElementById("scroll-progress");
      const menuToggle = document.getElementById("menu-toggle");
      const navLinks = document.getElementById("nav-links");
      const backToTop = document.getElementById("back-to-top");
      const motionToggle = document.getElementById("motion-toggle");
      const motionToggleLabel = document.getElementById("motion-toggle-label");

      function updateScrollUI() {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        const amount = scrollable > 0 ? window.scrollY / scrollable : 0;
        if (progress) progress.style.transform = `scaleX(${Math.max(0, Math.min(1, amount))})`;
        if (header) header.classList.toggle("is-scrolled", window.scrollY > 12);
        if (backToTop) backToTop.classList.toggle("is-visible", window.scrollY > 500);
      }

      window.addEventListener("scroll", updateScrollUI, { passive: true });
      window.addEventListener("resize", updateScrollUI);
      updateScrollUI();

      if (menuToggle && navLinks) {
        menuToggle.addEventListener("click", () => {
          const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
          menuToggle.setAttribute("aria-expanded", String(!isOpen));
          menuToggle.setAttribute("aria-label", isOpen ? "Open navigation menu" : "Close navigation menu");
          navLinks.classList.toggle("is-open", !isOpen);
        });

        navLinks.querySelectorAll("a").forEach(link => {
          link.addEventListener("click", () => {
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "Open navigation menu");
            navLinks.classList.remove("is-open");
          });
        });

        document.addEventListener("click", event => {
          if (!navLinks.contains(event.target) && !menuToggle.contains(event.target)) {
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "Open navigation menu");
            navLinks.classList.remove("is-open");
          }
        });
      }

      if (backToTop) {
        backToTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" }));
      }

      const revealItems = document.querySelectorAll(".reveal");
      if ("IntersectionObserver" in window && !reducedMotion) {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });
        revealItems.forEach(item => observer.observe(item));
      } else {
        revealItems.forEach(item => item.classList.add("visible"));
      }

      const dynamicWord = document.getElementById("dynamic-word");
      if (dynamicWord && !reducedMotion) {
        const words = ["AI", "Security", "Trust", "Resilience"];
        let wordIndex = 0;
        window.setInterval(() => {
          dynamicWord.classList.add("is-changing");
          window.setTimeout(() => {
            wordIndex = (wordIndex + 1) % words.length;
            dynamicWord.textContent = words[wordIndex];
            dynamicWord.classList.remove("is-changing");
          }, 280);
        }, 2200);
      }

      const deadline = new Date("2027-04-13T09:00:00+02:00").getTime();
      function updateCountdown() {
        const remaining = deadline - Date.now();
        const values = {
          days: Math.max(0, Math.floor(remaining / 86400000)),
          hours: Math.max(0, Math.floor((remaining % 86400000) / 3600000)),
          minutes: Math.max(0, Math.floor((remaining % 3600000) / 60000)),
          seconds: Math.max(0, Math.floor((remaining % 60000) / 1000))
        };
        Object.entries(values).forEach(([id, value]) => {
          const element = document.getElementById(id);
          if (element) element.textContent = String(value).padStart(2, "0");
        });
      }
      updateCountdown();
      window.setInterval(updateCountdown, 1000);

      if (motionToggle) {
        motionToggle.addEventListener("click", () => {
          const paused = document.body.classList.toggle("motion-paused");
          motionToggle.setAttribute("aria-pressed", String(paused));
          if (motionToggleLabel) motionToggleLabel.textContent = paused ? "Resume animations" : "Pause animations";
        });
      }

      const sections = document.querySelectorAll("main section[id]");
      if ("IntersectionObserver" in window) {
        const sectionObserver = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            navLinks?.querySelectorAll('a[href^="#"]').forEach(link => {
              if (link.getAttribute("href") === `#${entry.target.id}`) {
                link.setAttribute("aria-current", "location");
              } else {
                link.removeAttribute("aria-current");
              }
            });
          });
        }, { rootMargin: "-25% 0px -65% 0px" });
        sections.forEach(section => sectionObserver.observe(section));
      }
    })();
  </script>
